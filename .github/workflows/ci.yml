# Continuous integration: lint, tests, configuration checks, image builds and security scan.
# Nothing is pushed or deployed here (CD on tags: issue 19). Explained in docs/ci.md.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

# A new run on the same branch (or pull request) cancels the one still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default for every job: read the code, nothing else. A job that needs more asks for it
permissions:
  contents: read

jobs:
  generator:
    name: generator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not kept in .git/config: later steps cannot reuse it
          persist-credentials: false

      # Same Python minor version as the image (python:3.13.x-slim-trixie)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: generator/requirements*.txt

      - run: pip install -r requirements-dev.txt
      # "github" format: errors are also shown as annotations on the changed lines
      - run: ruff check --output-format=github
      - run: ruff format --check
      - run: pytest

  api:
    name: api (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # One failing version does not cancel the other: both results stay visible
      fail-fast: false
      matrix:
        # 20.19: developer machine (minimum supported); 24: version of the Docker images
        node: ["20.19", "24"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # PGlite (in-memory PostgreSQL) and a fake generator: no external service needed
      - run: npm test

  frontend:
    name: frontend (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "24"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  config:
    name: config
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KUBECONFORM_VERSION: v0.8.0
      # From the CHECKSUMS file of the release: the download is refused if it was altered
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # Same version and checksum as the deploy job of release.yml
      KUSTOMIZE_VERSION: v5.8.2
      KUSTOMIZE_SHA256: 06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95
      # Version of the cluster (Docker Desktop, kubeadm)
      KUBERNETES_VERSION: 1.36.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The ":?" checks of docker-compose.yml need the variables of .env
      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet

      - name: Install kubeconform
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform

      - name: Install kustomize
        run: |
          curl -fsSLo "$RUNNER_TEMP/kustomize.tar.gz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize

      # A manifest missing from kustomization.yaml would never be deployed, without any error
      - name: Check that every manifest is listed in kustomization.yaml
        run: |
          missing=0
          for file in deploy/*.yaml; do
            name="$(basename "$file")"
            [ "$name" = kustomization.yaml ] && continue
            if ! grep -qxF "  - $name" deploy/kustomization.yaml; then
              echo "::error file=$file::$name is not listed in deploy/kustomization.yaml"
              missing=1
            fi
          done
          exit "$missing"

      # What "kubectl apply -k deploy/" and Argo CD apply: the output of kustomize, not the files.
      # -strict: unknown fields are errors. Middleware is a Traefik CRD without a schema in the
      # Kubernetes catalog: skipped by name, not with -ignore-missing-schemas, which would also
      # skip a misspelled apiVersion (apps/v2) without any error
      - name: Validate Kubernetes manifests
        run: |
          "$RUNNER_TEMP/kustomize" build deploy/ > "$RUNNER_TEMP/deckgen.yaml"
          "$RUNNER_TEMP/kubeconform" -strict -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -skip traefik.io/v1alpha1/Middleware \
            "$RUNNER_TEMP/deckgen.yaml"

  images:
    name: images (${{ matrix.service }})
    # Images are built only for code that passed lint, tests and configuration checks
    needs: [generator, api, frontend, config]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job permissions replace the workflow ones: contents is repeated for the checkout
    permissions:
      contents: read
      # Upload of the Trivy SARIF report to the Security tab (code scanning)
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, generator]
    env:
      SERVICE: ${{ matrix.service }}
      TRIVY_VERSION: v0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # deckgen-api:ci-1a2b3c4 (on a pull request, GITHUB_SHA is the merge commit that is tested)
      - name: Set image name
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "version=ci-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image=deckgen-${SERVICE}:ci-${short_sha}" >> "$GITHUB_OUTPUT"

      # BuildKit builder in a container: needed for the GitHub Actions cache (type=gha)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: false
          # Image loaded into the local Docker engine, where Trivy scans it
          load: true
          tags: ${{ steps.meta.outputs.image }}
          # Version shown by the frontend (footer, /version.json); the other images have no ARG
          build-args: ${{ matrix.service == 'frontend' && format('APP_VERSION={0}', steps.meta.outputs.version) || '' }}
          # One cache per service; mode=max also keeps the layers of the build stages
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 1. Readable report, never blocking: MEDIUM to CRITICAL, fixed or not
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Vulnerability tables only, without the summary listing every package.json scanned
          TRIVY_TABLE_MODE: detailed
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          version: ${{ env.TRIVY_VERSION }}
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          output: trivy-report.txt

      - name: Show report
        run: |
          cat trivy-report.txt
          {
            echo "### Trivy: deckgen-${SERVICE}"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 2. Same findings in SARIF, for the Security tab. Trivy is already installed (step 1)
      - name: Scan image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          skip-setup-trivy: true
          format: sarif
          output: trivy-results.sarif
          severity: MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: true

      # A pull request from a fork gets a read-only token: the upload would fail
      - name: Upload SARIF to GitHub Security
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          # One category per image: each upload replaces only the alerts of its own image
          category: trivy-${{ matrix.service }}

      # 3. Failure policy: only CRITICAL vulnerabilities that already have a fix
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          skip-setup-trivy: true
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
