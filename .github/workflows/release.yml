# Release and deployment, on a version tag pushed on main (vX.Y.Z or vX.Y.Z-rc.N):
# build of the images -> push to GHCR -> deployment on Kubernetes. The deployment is GitOps:
# this workflow writes the version to deploy on the production branch, and Argo CD, inside the
# cluster, applies it (the cluster cannot be reached from GitHub). Explained in docs/cd.md.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# One release at a time; a release already running is never cancelled
concurrency:
  group: release
  cancel-in-progress: false

# Default for every job: read the code. Each job asks for what it needs in addition
permissions:
  contents: read

env:
  # Owner in lower case, as required by the registry
  IMAGE_PREFIX: ghcr.io/marc-awad/deckgen
  KUSTOMIZE_VERSION: v5.8.2
  # From the checksums.txt file of the release: the download is refused if it was altered
  KUSTOMIZE_SHA256: 06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95
  TRIVY_VERSION: v0.75.0

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # 1.0.0 or 1.0.0-rc.1: the tag without its "v"
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Whole history of every branch: merge-base needs the history of main
          fetch-depth: 0
          persist-credentials: false

      # The trigger filter is coarse (v1.2.3-anything): the exact Semantic Versioning format is
      # checked here. No build metadata (+...): "+" is not allowed in a Docker tag
      - name: Check the tag format
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $semver ]]; then
            echo "::error::Tag $TAG is not a semantic version (vX.Y.Z or vX.Y.Z-rc.N)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Only code merged into main (through a pull request and the 9 CI checks) is released
      - name: Check that the tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Commit $commit of tag $TAG is not on main"
            exit 1
          fi
          echo "Commit $commit of tag $TAG is on main"

  publish:
    name: publish (${{ matrix.service }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Push of the images to ghcr.io
      packages: write
      # Signed provenance attestation: Sigstore certificate (OIDC token) and attestations API
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # Same title and description as the LABEL of each Dockerfile: metadata-action would
        # otherwise replace them with those of the repository (which has no description)
        include:
          - service: api
            description: "deckgen REST API: decks and cards in PostgreSQL, generation and Anki export"
          - service: frontend
            description: "deckgen web interface served by nginx, with /api forwarded to the api"
          - service: generator
            description: "Generates flashcards from a course with a local LLM served by Ollama"
    env:
      SERVICE: ${{ matrix.service }}
      IMAGE: ghcr.io/marc-awad/deckgen-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GITHUB_TOKEN of this run: no secret to create
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags for v1.2.3: 1.2.3, 1.2 and sha-1a2b3c4. A pre-release (v1.2.3-rc.1) only gets
      # 1.2.3-rc.1 and sha-...: "1.2" must not point to a test version. No "latest"
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=deckgen-${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Version shown by the frontend (footer, /version.json)
          build-args: ${{ matrix.service == 'frontend' && format('APP_VERSION={0}', needs.verify.outputs.version) || '' }}
          # Reads the cache written by the CI on develop (same scope); a cache written by a tag
          # could only be read by this same tag, so none is written
          cache-from: type=gha,scope=${{ matrix.service }}
          # Stored next to the image in the registry: how it was built, and its package list
          provenance: mode=max
          sbom: true

      # Signed by Sigstore and verifiable: gh attestation verify oci://<image>@<digest> -R marc-awad/deckgen
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records only exist for repositories owned by an organization
          create-storage-record: false

      # Outputs of a matrix job overwrite each other: each digest goes into its own artifact
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$SERVICE"
          echo "$IMAGE@$DIGEST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}
          path: ${{ runner.temp }}/digests/${{ matrix.service }}
          if-no-files-found: error

  scan:
    name: scan (${{ matrix.service }})
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Pull of the published image, even while its package is still private
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend, generator]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.service }}
          path: ${{ runner.temp }}/digests

      # Scanned by digest: exactly the image that will be deployed
      - name: Image reference
        id: image
        run: echo "ref=${IMAGE_PREFIX}-${SERVICE}@$(cat "$RUNNER_TEMP/digests/$SERVICE")" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same policy as the CI (docs/ci.md): readable report, never blocking...
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_TABLE_MODE: detailed
          # Straight from the registry (the image is not in the local Docker engine)
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          version: ${{ env.TRIVY_VERSION }}
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          output: trivy-report.txt

      - name: Show report
        run: |
          cat trivy-report.txt
          {
            echo "### Trivy: deckgen-${SERVICE}"
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ...and failure only for CRITICAL vulnerabilities that already have a fix
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          skip-setup-trivy: true
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Déploiement sur Kubernetes
    needs: [verify, publish, scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Push of the production branch
      contents: write
    # Shown in the "Deployments" page of the repository
    environment:
      name: production
      url: https://github.com/marc-awad/deckgen/tree/production
    outputs:
      commit: ${{ steps.push.outputs.commit }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # deploy/ of the tagged commit, and nothing else
      - name: Check out deploy/ of the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          sparse-checkout: deploy
          persist-credentials: false

      # Public repository: no token needed to list its branches. Exit code 2: no such branch
      - name: Check whether the production branch exists
        id: branch
        run: |
          set +e
          git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" production > /dev/null
          code=$?
          set -e
          case "$code" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      # Credentials kept (default): they are used by "git push" below
      - name: Check out the production branch
        if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: production
          path: production

      - name: Check out the repository (first deployment)
        if: steps.branch.outputs.exists == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: production

      # Branch without history and without files: it will only contain deploy commits
      - name: Create the production branch
        if: steps.branch.outputs.exists == 'false'
        working-directory: production
        run: git switch --orphan production

      - name: Install kustomize
        run: |
          curl -fsSLo "$RUNNER_TEMP/kustomize.tar.gz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      # deploy/ of production becomes deploy/ of the tag, then each local image (deckgen-api...)
      # is replaced by the published one, version AND digest: ghcr.io/...:1.0.0@sha256:...
      # The digest wins: the cluster runs the image that was built and scanned, even if the
      # tag 1.0.0 were pushed again later
      - name: Update deploy/ and the images
        working-directory: production
        run: |
          rm -rf deploy
          cp -R ../source/deploy deploy
          for service in api frontend generator; do
            digest="$(cat "$RUNNER_TEMP/digests/$service")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid digest for $service: $digest"
              exit 1
            fi
            (cd deploy && "$RUNNER_TEMP/kustomize" edit set image \
              "deckgen-${service}=${IMAGE_PREFIX}-${service}:${VERSION}@${digest}")
          done
          cat > README.md <<EOF
          # Branch production

          Written only by the deploy job of .github/workflows/release.yml (do not edit by hand).
          Argo CD applies deploy/ to the cluster. Current version: v${VERSION}.
          EOF
          echo "--- images block of deploy/kustomization.yaml"
          sed -n '/^images:/,$p' deploy/kustomization.yaml

      # Read back by another kustomize (the one of kubectl), like Argo CD will: the result must
      # build, and must contain the three published images and no local image
      - name: Check the manifests with kubectl kustomize
        run: |
          kubectl version --client
          kubectl kustomize production/deploy > "$RUNNER_TEMP/rendered.yaml"
          if grep -nE '^\s+image: deckgen-' "$RUNNER_TEMP/rendered.yaml"; then
            echo "::error::A local image is left in the manifests"
            exit 1
          fi
          for service in api frontend generator; do
            expected="image: ${IMAGE_PREFIX}-${service}:${VERSION}@$(cat "$RUNNER_TEMP/digests/$service")"
            grep -qF "$expected" "$RUNNER_TEMP/rendered.yaml" || { echo "::error::Missing $expected"; exit 1; }
            echo "OK $expected"
          done

      # Author github-actions[bot], with a Signed-off-by line. "git push" with GITHUB_TOKEN
      # does not start any workflow (docs/cd.md)
      - name: Commit and push
        id: push
        working-directory: production
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Production already deploys ${TAG}: nothing to commit"
          else
            git commit --signoff --file - <<EOF
          deploy: ${TAG}

          Tagged commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
            git push origin HEAD:production
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  summary:
    name: summary
    needs: [verify, publish, scan, deploy]
    # Also after a failure: the summary shows which job failed
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: needs.publish.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Release summary
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.deploy.outputs.commit }}
          RESULTS: >-
            verify=${{ needs.verify.result }} publish=${{ needs.publish.result }}
            scan=${{ needs.scan.result }} deploy=${{ needs.deploy.result }}
        run: |
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "## Release ${TAG}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION:-?}\` |"
            echo "| Tagged commit | [\`${GITHUB_SHA::7}\`](${repo}/commit/${GITHUB_SHA}) |"
            echo "| Jobs | ${RESULTS} |"
            if [ -n "$COMMIT" ]; then
              echo "| Deploy commit | [\`${COMMIT::7}\`](${repo}/commit/${COMMIT}) on [production](${repo}/tree/production) |"
            fi
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            for service in api frontend generator; do
              file="$RUNNER_TEMP/digests/$service"
              digest="$( [ -f "$file" ] && cat "$file" || echo "not published" )"
              echo "| \`${IMAGE_PREFIX}-${service}:${VERSION}\` | \`${digest}\` |"
            done
            echo
            echo "Argo CD applies the production branch within 3 minutes (polling)."
          } >> "$GITHUB_STEP_SUMMARY"
